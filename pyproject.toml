[project]
name = "autonomous-qa-agent"
version = "0.1.0"
description = "Autonomous AI QA engineer: requirements to scenarios, planned execution, failure analysis and self-healing recommendations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
qa-agent = "autonomous_qa_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: exercises several real components together",
    "e2e: drives a real browser or device (opt-in)",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "PIE", "RET"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ------------------------------------------------------------------ coverage
[tool.coverage.run]
source = ["autonomous_qa_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
